<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hook - Add Music</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#221022",
                        "surface-dark": "#2d1b2d",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .glass-panel {
            background: rgba(34, 16, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #f20df2;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #f20df2;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen font-display antialiased text-gray-900 dark:text-white overflow-x-hidden pb-32">
    <!-- Header -->
    <div class="sticky top-0 z-40 w-full glass-panel border-b border-white/5">
        <div class="flex items-center p-4 justify-between max-w-md mx-auto">
            <button onclick="window.location.href='trending_songs_dashboard.html'"
                class="flex items-center justify-center rounded-full size-10 bg-white/5 hover:bg-white/10 transition-colors text-white">
                <span class="material-symbols-outlined">close</span>
            </button>
            <h1 class="text-white text-xl font-bold tracking-tighter uppercase">Add Music</h1>
            <div class="size-10"></div> <!-- Spacer -->
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col max-w-md mx-auto w-full px-5 pt-6 gap-8">

        <!-- Upload Section -->
        <div
            class="flex flex-col items-center gap-4 py-6 border-2 border-dashed border-white/10 rounded-2xl bg-white/5 hover:bg-white/10 transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-4xl text-primary">cloud_upload</span>
            <div class="text-center">
                <p class="text-white font-bold">Upload Audio</p>
                <p class="text-white/50 text-xs">MP3, WAV, or FLAC (Max 20MB)</p>
            </div>
        </div>

        <!-- Song Details -->
        <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label class="text-white/50 text-xs font-bold uppercase tracking-wider pl-2">Title</label>
                <input type="text" placeholder="Song Title"
                    class="bg-surface-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:border-primary focus:ring-primary placeholder-white/20">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-white/50 text-xs font-bold uppercase tracking-wider pl-2">Artist</label>
                <input type="text" placeholder="Artist Name"
                    class="bg-surface-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:border-primary focus:ring-primary placeholder-white/20">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-white/50 text-xs font-bold uppercase tracking-wider pl-2">Genre</label>
                <select
                    class="bg-surface-dark border border-white/10 rounded-xl px-4 py-3 text-white focus:border-primary focus:ring-primary">
                    <option>Pop</option>
                    <option>Hip-Hop</option>
                    <option>Electronic</option>
                    <option>R&B</option>
                    <option>Rock</option>
                    <option>Alternative</option>
                </select>
            </div>
        </div>

        <!-- Distribution Platforms -->
        <div class="flex flex-col gap-4">
            <p class="text-white/50 text-xs font-bold uppercase tracking-wider pl-2">Distribute To</p>

            <!-- Spotify -->
            <div class="flex items-center justify-between p-4 bg-surface-dark rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <!-- Simple Icon Placeholder -->
                    <div
                        class="size-8 rounded-full bg-[#1DB954] flex items-center justify-center text-white font-bold text-xs">
                        Sp</div>
                    <p class="text-white font-bold">Spotify</p>
                </div>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="spotify-toggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer checked:right-0 checked:border-primary transition-all duration-300"
                        checked />
                    <label for="spotify-toggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer checked:bg-primary transition-colors"></label>
                </div>
            </div>

            <!-- Apple Music -->
            <div class="flex items-center justify-between p-4 bg-surface-dark rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <div
                        class="size-8 rounded-full bg-[#FA243C] flex items-center justify-center text-white font-bold text-xs">
                        AM</div>
                    <p class="text-white font-bold">Apple Music</p>
                </div>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="apple-toggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer checked:right-0 checked:border-primary transition-all duration-300"
                        checked />
                    <label for="apple-toggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer checked:bg-primary transition-colors"></label>
                </div>
            </div>

            <!-- TikTok -->
            <div class="flex items-center justify-between p-4 bg-surface-dark rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <div
                        class="size-8 rounded-full bg-black border border-white/20 flex items-center justify-center text-white font-bold text-xs">
                        TT</div>
                    <p class="text-white font-bold">TikTok</p>
                </div>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="tiktok-toggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer checked:right-0 checked:border-primary transition-all duration-300"
                        checked />
                    <label for="tiktok-toggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer checked:bg-primary transition-colors"></label>
                </div>
            </div>

            <!-- YouTube Music -->
            <div class="flex items-center justify-between p-4 bg-surface-dark rounded-xl border border-white/5">
                <div class="flex items-center gap-3">
                    <div
                        class="size-8 rounded-full bg-[#FF0000] flex items-center justify-center text-white font-bold text-xs">
                        YT</div>
                    <p class="text-white font-bold">YouTube Music</p>
                </div>
                <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                    <input type="checkbox" name="toggle" id="yt-toggle"
                        class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer checked:right-0 checked:border-primary transition-all duration-300"
                        checked />
                    <label for="yt-toggle"
                        class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-700 cursor-pointer checked:bg-primary transition-colors"></label>
                </div>
            </div>

        </div>

        <!-- Submit Button -->
        <button onclick="startUpload()"
            class="w-full h-14 bg-primary text-white text-lg font-bold rounded-full shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-95 transition-all mt-4 mb-10">
            Upload & Distribute
        </button>

    </div>

    <script>
        function startUpload() {
            // Mock Upload Process
            const btn = document.querySelector('button[onclick="startUpload()"]');
            const originalText = btn.innerText;

            btn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Uploading...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined mr-2">check_circle</span> Uploaded!';
                btn.classList.remove('bg-primary', 'shadow-primary/25');
                btn.classList.add('bg-green-500', 'shadow-green-500/25');

                setTimeout(() => {
                    window.location.href = 'trending_songs_dashboard.html';
                }, 1500);
            }, 2000);
        }
    </script>
</body>

</html>
