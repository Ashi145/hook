<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Welcome to Hook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#221022",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="font-display antialiased">
    <div
        class="relative flex h-full min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden transition-colors duration-200">
        <!-- Ambient Background Glows -->
        <div
            class="pointer-events-none absolute top-[-100px] right-[-50px] h-64 w-64 rounded-full bg-primary/20 blur-[100px]">
        </div>
        <div
            class="pointer-events-none absolute bottom-[10%] left-[-50px] h-48 w-48 rounded-full bg-primary/10 blur-[80px]">
        </div>
        <!-- Header / Logo -->
        <div class="flex w-full items-center justify-center pt-8 pb-4 relative z-10">
            <div class="flex items-center gap-2">
                <div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary text-white">
                    <span class="material-symbols-outlined text-[20px]">music_note</span>
                </div>
                <span class="text-slate-900 dark:text-white text-xl font-bold tracking-tight">Hook</span>
            </div>
        </div>
        <!-- Main Content Area -->
        <div class="flex flex-1 flex-col justify-center px-4 relative z-10">
            <!-- Hero Visual -->
            <div class="flex w-full justify-center py-6">
                <div class="relative w-full max-w-[320px] aspect-square">
                    <!-- Decorative glow behind image -->
                    <div
                        class="absolute inset-0 bg-gradient-to-tr from-primary/40 to-purple-600/40 blur-2xl rounded-full scale-90 animate-pulse">
                    </div>
                    <div class="relative w-full h-full rounded-xl overflow-hidden shadow-2xl border border-white/10">
                        <div class="w-full h-full bg-center bg-no-repeat bg-cover transform transition-transform duration-700 hover:scale-105"
                            data-alt="Abstract 3D neon musical waveform visualization with pink and purple hues"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuB41PzRQuPWE26xLvtw6LmyPZ2RqiEkC_Ou-2C4QoYQR2xy8SaprzSzWbSijmIPMeqmN9rVrbNvodPAFCSPKCMKTxuInsjao1tmMon9wXX3WVT8j1cp1hXz4o_GHq1tDfXs_UG3GI6BbAA4nQhL1q7ZVoUWOMXMi7keztrsXnA17fn6syTZbw_aq8KQyfmPbUk4tNO3YKFRMfcliTVuUHxIfNTvKVLF-zvqS_rbBebfgkcf-IPL0TVEp_ShcjmJp54SIQgigNpxH1E");'>
                            <div class="absolute inset-0 bg-black/20"></div>
                        </div>
                        <!-- Floating Trend Card UI Element -->
                        <div
                            class="absolute bottom-4 left-4 right-4 bg-background-dark/80 backdrop-blur-md border border-white/10 p-3 rounded-lg flex items-center gap-3">
                            <div class="h-10 w-10 rounded-full bg-slate-700 overflow-hidden flex-shrink-0">
                                <img alt="Artist avatar" class="h-full w-full object-cover"
                                    src="https://lh3.googleusercontent.com/aida-public/AB6AXuBB6y3Rh4p1yjol2WWMk4e-IeIpd49E1QE3LAY5owd7Tb4krOHfQSwH8wQRI0gnz1p_pDahCljmj6vrWVxPfncFafKmZ992h8Sh1opaQO1Grkd7Rb712y0WBo7H8DS5AFnMVIyRZEeQDRhCi8hElsB6c10psjZOrKoiH_JhaxygK5jukRdnbzVltJf-nz3Lc8RLi5ux-hrtzrRJagrjfx4DHVcXX5k96Qzo00HxtvvCZ5VVl8yMMDMBKFCuLsrjQCTW1aPjfOfWWFw" />
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-white text-xs font-bold truncate">Neon Nights</div>
                                <div class="text-primary text-[10px] font-medium flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[10px]">trending_up</span>
                                    +240% Viral
                                </div>
                            </div>
                            <div
                                class="h-8 w-8 rounded-full bg-white/10 flex items-center justify-center text-white cursor-pointer hover:bg-white/20 transition-colors">
                                <span class="material-symbols-outlined text-[18px]">play_arrow</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Text Content -->
            <div class="flex flex-col items-center max-w-md mx-auto mt-4">
                <h1
                    class="text-slate-900 dark:text-white tracking-tight text-[36px] font-extrabold leading-[1.1] text-center px-2">
                    Make Hits <br /><span class="text-primary">Happen</span>
                </h1>
                <p
                    class="text-slate-600 dark:text-gray-300 text-base font-normal leading-relaxed pt-4 px-4 text-center">
                    Discover the viral potential in every beat. Hook identifies trending sounds instantly so you can
                    generate streams faster.
                </p>
            </div>
        </div>
        <!-- Bottom CTA Section -->
        <div
            class="w-full px-6 pb-10 pt-6 relative z-10 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent">
            <div class="flex flex-col items-center gap-4 max-w-[480px] mx-auto">
                <button onclick="window.location.href='trending_songs_dashboard.html'"
                    class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full h-14 px-8 bg-primary text-white text-lg font-bold leading-normal tracking-wide shadow-lg shadow-primary/25 transition-all hover:shadow-primary/40 active:scale-95">
                    <span
                        class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></span>
                    <span class="relative z-10 flex items-center gap-2">
                        Get Started
                        <span
                            class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </span>
                </button>
                <div class="flex items-center justify-center gap-1 text-sm font-medium">
                    <span class="text-slate-500 dark:text-slate-400">Already have an account?</span>
                    <a class="text-primary hover:text-primary/80 transition-colors"
                        href="trending_songs_dashboard.html">Log in</a>
                </div>
            </div>
            <!-- Safe area spacer for iOS home indicator -->
            <div class="h-4 w-full"></div>
        </div>
    </div>
</body>

</html>
