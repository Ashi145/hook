<!DOCTYPE html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Hook - Song Details</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Theme Configuration -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f20df2",
            "background-light": "#f8f5f8",
            "background-dark": "#221022",
          },
          fontFamily: {
            "display": ["Spline Sans", "Noto Sans", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
          animation: {
            'pulse-glow': 'pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            'pulse-glow': {
              '0%, 100%': { opacity: '1', transform: 'scale(1)' },
              '50%': { opacity: '.85', transform: 'scale(0.98)' },
            }
          }
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom scrollbar hiding for clean mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-gray-100 dark:bg-black font-display antialiased flex justify-center min-h-screen">
  <!-- Mobile Screen Container -->
  <div
    class="relative flex h-full min-h-screen w-full max-w-[430px] flex-col bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl group/design-root">
    <!-- Ambient Background Glows -->
    <div
      class="absolute top-[-10%] left-[-10%] w-[80%] h-[50%] bg-primary/20 blur-[120px] rounded-full pointer-events-none">
    </div>
    <div
      class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[40%] bg-blue-500/10 blur-[100px] rounded-full pointer-events-none">
    </div>
    <!-- Header / Navigation -->
    <div
      class="absolute top-0 left-0 w-full z-30 p-4 pt-12 flex justify-between items-center bg-gradient-to-b from-background-dark/80 to-transparent">
      <button onclick="window.location.href='trending_songs_dashboard.html'"
        class="text-slate-800 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full bg-white/20 backdrop-blur-md border border-white/10 transition-transform active:scale-95">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <button
        class="text-slate-800 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full bg-white/20 backdrop-blur-md border border-white/10 transition-transform active:scale-95">
        <span class="material-symbols-outlined">more_horiz</span>
      </button>
    </div>
    <!-- Scrollable Content -->
    <div class="flex-1 overflow-y-auto no-scrollbar pb-[140px]">
      <!-- Hero Image Section -->
      <div class="w-full pt-28 px-6 pb-6 flex flex-col items-center">
        <div class="relative w-full aspect-square rounded-[32px] shadow-2xl group cursor-pointer">
          <!-- Album Art -->
          <div class="w-full h-full bg-center bg-no-repeat bg-cover rounded-[32px] relative z-10 border border-white/10"
            data-alt="Neon futuristic city skyline at night with cybernetic elements"
            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDfayUubXVwr3Zi5skA4pfzgpjchVgFPpkBb64gbOiJlABy3tGRy8HiXCcSTSRHOB3BzuZicc3RlK9T_bCizG0riK9ddx6Um7LvxcZLOyrECksQnTK9ieV7X-rdyHW04wfAecT_GNGZrighRziklNcFmyEuEHIS7yBCHrlDcV9wHrR_vUpE01cLJlUFSqfmvQ1jGsG-LlAwn8d9ueBeYCkQeTmePSa27V-Y1js85qySThzJ3nl9i_MTndFryuIuoFBgAPARBF9Cugk");'>
          </div>
          <!-- Glow Behind Art -->
          <div
            class="absolute inset-4 bg-primary/60 blur-[40px] -z-10 transition-all duration-700 group-hover:bg-primary/80 group-hover:blur-[50px] group-hover:inset-2">
          </div>
        </div>
      </div>
      <!-- Track Info -->
      <div class="px-6 flex flex-col gap-2 mb-6">
        <h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-none text-left">Midnight
          City (Remix)</h1>
        <div class="flex gap-2 flex-wrap items-center pt-2">
          <div
            class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full border border-slate-200 dark:border-white/10 bg-slate-100 dark:bg-white/5 pl-4 pr-4">
            <span class="material-symbols-outlined text-[16px] text-primary">verified</span>
            <p class="text-slate-700 dark:text-gray-200 text-sm font-medium leading-normal">M83 vs. Starboy</p>
          </div>
          <div
            class="flex h-8 shrink-0 items-center justify-center gap-x-2 rounded-full border border-slate-200 dark:border-white/10 bg-slate-100 dark:bg-white/5 pl-3 pr-3">
            <p class="text-slate-500 dark:text-gray-400 text-xs font-medium uppercase tracking-wider">Electronic</p>
          </div>
        </div>
      </div>
      <!-- Trend Pulse Panel -->
      <div class="px-4 mb-6">
        <div
          class="relative overflow-hidden rounded-2xl border border-primary/30 bg-background-light dark:bg-[#2a152a] p-5 shadow-lg shadow-primary/5">
          <!-- Decorative background element -->
          <div class="absolute -right-10 -top-10 w-32 h-32 bg-primary/10 rounded-full blur-2xl"></div>
          <div class="flex items-start gap-4 relative z-10">
            <div class="flex flex-col gap-1 flex-1">
              <div class="flex items-center gap-2 mb-1">
                <span class="material-symbols-outlined text-primary text-[20px]">monitoring</span>
                <p class="text-slate-900 dark:text-white text-base font-bold leading-tight">Trend Pulse</p>
              </div>
              <p class="text-slate-600 dark:text-[#cb90cb] text-sm font-normal leading-relaxed">
                <span class="text-primary font-bold bg-primary/10 px-1 rounded">🔥 +450% Streams</span> this week. Viral
                dance challenge active in 12 countries.
              </p>
            </div>
            <button
              class="flex shrink-0 size-10 items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors border border-white/5">
              <span class="material-symbols-outlined text-sm">arrow_forward_ios</span>
            </button>
          </div>
        </div>
      </div>
      <!-- Social Sharing -->
      <div class="px-6">
        <p class="text-slate-400 dark:text-slate-500 text-xs font-bold uppercase tracking-widest mb-4 ml-1">Share the
          hype</p>
        <div class="flex gap-4">
          <button
            class="flex-1 h-12 rounded-xl bg-slate-200 dark:bg-white/5 flex items-center justify-center gap-2 hover:bg-slate-300 dark:hover:bg-white/10 transition-colors text-slate-800 dark:text-white">
            <span class="material-symbols-outlined text-[20px]">share</span>
            <span class="text-sm font-medium">Story</span>
          </button>
          <button
            class="size-12 rounded-xl bg-slate-200 dark:bg-white/5 flex items-center justify-center hover:bg-slate-300 dark:hover:bg-white/10 transition-colors text-slate-800 dark:text-white">
            <span class="material-symbols-outlined text-[20px]">link</span>
          </button>
          <button
            class="size-12 rounded-xl bg-slate-200 dark:bg-white/5 flex items-center justify-center hover:bg-slate-300 dark:hover:bg-white/10 transition-colors text-slate-800 dark:text-white">
            <span class="material-symbols-outlined text-[20px]">favorite</span>
          </button>
        </div>
      </div>
    </div>
    <!-- Fixed Bottom Action Cluster -->
    <div
      class="absolute bottom-0 w-full p-6 pt-12 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark/95 z-20">
      <div class="flex items-center gap-4">
        <!-- Play Preview Button -->
        <button
          class="group relative flex size-14 shrink-0 items-center justify-center overflow-hidden rounded-full bg-slate-200 dark:bg-white/10 text-slate-900 dark:text-white transition-all active:scale-90">
          <span
            class="material-symbols-outlined text-3xl ml-1 group-hover:scale-110 transition-transform">play_arrow</span>
        </button>
        <!-- Primary Action -->
        <button
          class="relative flex h-14 grow items-center justify-center overflow-hidden rounded-full bg-primary text-white shadow-[0_0_20px_rgba(242,13,242,0.4)] transition-all active:scale-95 hover:shadow-[0_0_35px_rgba(242,13,242,0.6)]">
          <div
            class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] animate-[shimmer_2s_infinite]">
          </div>
          <span class="material-symbols-outlined mr-2">bolt</span>
          <span class="text-base font-bold tracking-wide">Generate Streams</span>
        </button>
      </div>
      <!-- Safe Area Indicator -->
      <div class="w-full flex justify-center mt-5">
        <div class="w-32 h-1 bg-slate-300 dark:bg-white/20 rounded-full"></div>
      </div>
    </div>
  </div>
  <style>
    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</body>

</html>
