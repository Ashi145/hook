<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hook - Stats</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#221022",
                        "surface-dark": "#2d1b2d",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style>
        .glass-panel {
            background: rgba(34, 16, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen font-display antialiased text-gray-900 dark:text-white overflow-x-hidden pb-32">
    <!-- Header -->
    <div class="sticky top-0 z-40 w-full glass-panel border-b border-white/5">
        <div class="flex items-center p-4 justify-between max-w-md mx-auto">
            <h1 class="text-white text-xl font-bold tracking-tighter uppercase">Stats</h1>
            <span class="material-symbols-outlined text-primary">bar_chart</span>
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col max-w-md mx-auto w-full px-5 pt-6 gap-6">
        <!-- Mock Stat Card 1 -->
        <div class="bg-surface-dark border border-white/5 rounded-2xl p-6">
            <p class="text-white/50 text-sm font-bold uppercase tracking-wider mb-2">Total Streams</p>
            <h2 class="text-4xl font-bold text-white mb-4">1.2M</h2>
            <div class="h-2 w-full bg-white/10 rounded-full overflow-hidden">
                <div class="h-full bg-primary w-[70%]"></div>
            </div>
            <p class="text-primary text-sm font-bold mt-2">+12% this week</p>
        </div>

        <!-- Mock Stat Card 2 -->
        <div class="bg-surface-dark border border-white/5 rounded-2xl p-6">
            <p class="text-white/50 text-sm font-bold uppercase tracking-wider mb-2">Top Region</p>
            <div class="flex items-center gap-3">
                <span class="text-2xl">🇺🇸</span>
                <h2 class="text-2xl font-bold text-white">United States</h2>
            </div>
            <p class="text-white/50 text-sm mt-1">45% of total audience</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] z-50">
        <div class="glass-panel rounded-full h-16 px-6 flex items-center justify-between shadow-2xl">
            <button onclick="window.location.href='trending_songs_dashboard.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">home</span>
            </button>
            <button onclick="window.location.href='search.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">search</span>
            </button>
            <button onclick="window.location.href='favorites.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">favorite</span>
            </button>
            <button onclick="window.location.href='stats.html'"
                class="flex flex-col items-center justify-center gap-1 text-primary w-12 group">
                <span class="material-symbols-outlined fill-1">bar_chart</span>
            </button>
        </div>
    </div>
</body>

</html>
