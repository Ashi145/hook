<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hook - Search</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f20df2",
                        "background-light": "#f8f5f8",
                        "background-dark": "#221022",
                        "surface-dark": "#2d1b2d",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"
                    },
                },
            },
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="config.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(34, 16, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen font-display antialiased text-gray-900 dark:text-white overflow-x-hidden pb-32 selection:bg-primary selection:text-white">
    <!-- Sticky Header -->
    <div class="sticky top-0 z-40 w-full glass-panel border-b border-white/5">
        <div class="flex items-center p-4 justify-between max-w-md mx-auto">
            <h1 class="text-white text-xl font-bold tracking-tighter uppercase">Search</h1>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col max-w-md mx-auto w-full px-5 pt-6">
        <!-- Search Input -->
        <div class="relative group mb-6">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                <span
                    class="material-symbols-outlined text-white/50 group-focus-within:text-primary transition-colors text-[20px]">search</span>
            </div>
            <input id="searchInput"
                class="block w-full pl-10 pr-4 py-3 bg-surface-dark border border-white/5 rounded-full text-white placeholder-white/40 focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all shadow-lg shadow-black/10 text-sm font-medium"
                placeholder="Search songs, artists..." type="text" onkeypress="handleKeyPress(event)" />
            <button onclick="performSearch()"
                class="absolute right-2 top-1.5 bg-primary text-white rounded-full p-1.5 hover:bg-white hover:text-primary transition-colors">
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </div>

        <!-- Results Container -->
        <h2 class="text-white text-lg font-bold tracking-tight uppercase mb-4 flex items-center gap-2">
            Results <span id="resultsCount" class="text-xs text-primary font-normal hidden">(0)</span>
        </h2>

        <div id="resultsContainer" class="flex flex-col gap-4">
            <!-- Initial State / Empty State -->
            <div class="flex flex-col items-center justify-center py-20 text-white/30 gap-2">
                <span class="material-symbols-outlined text-6xl">graphic_eq</span>
                <p>Search for your next hook</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] z-50">
        <div class="glass-panel rounded-full h-16 px-6 flex items-center justify-between shadow-2xl">
            <button onclick="window.location.href='trending_songs_dashboard.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">home</span>
            </button>
            <button onclick="window.location.href='search.html'"
                class="flex flex-col items-center justify-center gap-1 text-primary w-12 group">
                <span class="material-symbols-outlined fill-1">search</span>
            </button>
            <button onclick="window.location.href='favorites.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">favorite</span>
            </button>
            <button onclick="window.location.href='stats.html'"
                class="flex flex-col items-center justify-center gap-1 text-white/50 hover:text-white w-12 transition-colors group">
                <span class="material-symbols-outlined">bar_chart</span>
            </button>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="text-center text-white/50">Searching...</div>';

            if (CONFIG.YOUTUBE_API_KEY === 'YOUR_API_KEY') {
                container.innerHTML = `
                    <div class="p-4 bg-red-500/20 border border-red-500/50 rounded-xl text-center">
                        <p class="text-white font-bold mb-2">API Key Required</p>
                        <p class="text-white/70 text-sm">Please open <code>config.js</code> and add your YouTube API Key.</p>
                    </div>
                `;
                return;
            }

            try {
                // Search for videos
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${encodeURIComponent(query)}&type=video&videoCategoryId=10&key=${CONFIG.YOUTUBE_API_KEY}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                container.innerHTML = '';
                document.getElementById('resultsCount').innerText = `(${data.items.length})`;
                document.getElementById('resultsCount').classList.remove('hidden');

                data.items.forEach((item, index) => {
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumb = item.snippet.thumbnails.high.url;

                    const card = `
                        <div onclick="window.location.href='song_details.html'" class="group flex items-center gap-4 py-3 border-b border-white/5 active:bg-white/5 transition-colors rounded-xl px-2 -mx-2 cursor-pointer">
                            <div class="text-white/40 text-lg font-bold w-4 text-center font-mono">${index + 1}</div>
                            <div class="relative shrink-0">
                                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-xl size-14 shadow-lg group-hover:scale-105 transition-transform duration-300" style="background-image: url('${thumb}');"></div>
                                <div class="absolute -bottom-1 -right-1 bg-black rounded-full p-0.5 border border-white/10">
                                    <div class="bg-white rounded-full size-4 flex items-center justify-center">
                                        <span class="material-symbols-outlined text-[10px] text-black">play_arrow</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col justify-center flex-1 min-w-0">
                                <div class="flex items-center gap-2">
                                    <p class="text-white text-base font-bold leading-normal truncate">${title}</p>
                                </div>
                                <p class="text-gray-400 text-sm font-normal leading-normal truncate">${channel}</p>
                            </div>
                            <div class="shrink-0">
                                <button class="flex items-center justify-center rounded-full size-8 bg-surface-dark border border-white/10 hover:border-primary/50 text-white transition-all active:scale-95">
                                    <span class="material-symbols-outlined text-[18px]">add</span>
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="text-center text-red-400 p-4">
                        Error: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>

</html>
